<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEMADD Links</title>

  <style>

    body{
      margin:0;
      padding:0;
      background:#111827;
      font-family:Arial, Helvetica, sans-serif;
      color:white;

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;
    }

    .container{
      width:350px;
      text-align:center;
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:20px;
    }

    h1{
      margin-bottom:10px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:30px;
    }

    .btn{
      display:block;
      background:#2563eb;
      color:white;
      text-decoration:none;
      padding:15px;
      margin-bottom:15px;
      border-radius:12px;
      font-size:18px;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
      transform:scale(1.03);
    }

  </style>
</head>

<body>

  <div class="container">

    <img
      class="logo"
      src="https://i.imgur.com/2DhmtJ4.png"
    >

    <h1>SEMADD</h1>

    <p>Selecciona un formulario</p>

    <a
      class="btn"
      href="https://forms.gle/FORMULARIO1"
      target="_blank"
    >
      Registro Curso
    </a>

    <a
      class="btn"
      href="https://forms.gle/FORMULARIO2"
      target="_blank"
    >
      Solicitar Cotización
    </a>

    <a
      class="btn"
      href="https://forms.gle/FORMULARIO3"
      target="_blank"
    >
      Contactar Soporte
    </a>

  </div>

</body>
</html>
